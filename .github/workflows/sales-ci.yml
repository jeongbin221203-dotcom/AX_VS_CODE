# 영업관리(sales_manager/) — SQLite 와 PostgreSQL 두 가지로 같은 테스트를 돌린다
name: sales-ci

on:
  push:
    paths: ["sales_manager/**", ".github/workflows/sales-ci.yml"]
  pull_request:
    paths: ["sales_manager/**", ".github/workflows/sales-ci.yml"]

defaults:
  run:
    working-directory: sales_manager

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sales_manager/requirements*.txt
      - name: 의존성
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          pip install -r requirements-dev.txt
      - name: 마이그레이션 왕복 (upgrade → downgrade → upgrade)
        if: matrix.db == 'postgres'
        env:
          SALES_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          python manage.py db upgrade
          python manage.py db downgrade 0003_catalog_quotes_vat
          python manage.py db upgrade
          python manage.py db current
      - name: 테스트
        env:
          SALES_TEST_PG_URL: ${{ matrix.db == 'postgres' && 'postgresql://postgres:postgres@127.0.0.1:5432/postgres' || '' }}
          SALES_PG_DUMP: pg_dump
        run: python -m pytest tests -q -p no:cacheprovider

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: 이미지 빌드
        run: docker build -t sales-crm:${{ github.sha }} .
      - name: 기동 확인 (production 설정 검사 통과 여부)
        run: |
          docker run --rm -e SALES_SECRET_KEY=ci -e SALES_AUTH_MODE=password -e SALES_AUTO_MIGRATE=1 \
            -e SALES_DB_PATH=/tmp/ci.db sales-crm:${{ github.sha }} python manage.py check
