<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="자재관리">
  <title>자재관리</title>
  <!-- 바탕: 청색 둥근 사각형 -->
  <rect width="64" height="64" rx="14" fill="#2747A3"/>
  <!-- 상자 (테이프 한 줄) -->
  <rect x="13" y="17" width="34" height="25" rx="3" fill="#FFFFFF"/>
  <rect x="27" y="17" width="6" height="11" fill="#2747A3"/>
  <!-- 팔레트: 상판 + 다리 셋 -->
  <rect x="9" y="44" width="42" height="5" rx="1.5" fill="#FFFFFF"/>
  <rect x="11" y="49" width="7" height="6" rx="1" fill="#FFFFFF"/>
  <rect x="26.5" y="49" width="7" height="6" rx="1" fill="#FFFFFF"/>
  <rect x="42" y="49" width="7" height="6" rx="1" fill="#FFFFFF"/>
  <!-- 인주 도장: 결재·확인 -->
  <circle cx="48" cy="16" r="9" fill="#C23A2E" stroke="#2747A3" stroke-width="3"/>
  <path d="M44 16.2l2.8 2.8 5.2-5.6" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
