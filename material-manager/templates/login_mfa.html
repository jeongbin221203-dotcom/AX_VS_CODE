{% extends "base.html" %}
{% block public %}
<form class="card form" method="post" action="{{ url_for('auth.login_mfa') }}">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <h3>2단계 인증</h3>
  <p class="muted small">인증 앱(Microsoft/Google Authenticator 등)에 뜬 6자리 코드를 입력하세요. 휴대폰을 잃어버렸으면 복구 코드를 입력합니다.</p>
  <label>인증 코드<input name="code" inputmode="numeric" autocomplete="one-time-code" required autofocus></label>
  <div><button class="btn btn-primary">확인</button> <a class="btn" href="{{ url_for('auth.login') }}">처음으로</a></div>
</form>
{% endblock %}
