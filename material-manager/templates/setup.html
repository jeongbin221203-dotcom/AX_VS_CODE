{% extends "base.html" %}
{% block public %}
<form class="card form" method="post" action="{{ url_for('auth.setup') }}">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <h3>최초 설정 — 시스템관리자 등록</h3>
  <p class="muted small">등록된 사용자가 없어 처음 한 번만 열리는 화면입니다. 여기서 만든 계정으로 다른 사용자를 추가합니다.</p>
  <label>설정 코드 (서버를 켠 콘솔에 찍힌 8자리)<input name="setup_code" autocomplete="off" required></label>
  <label>아이디 (영문·숫자 3~30자)<input name="username" value="{{ form.username or '' }}" required></label>
  <label>이름<input name="name" value="{{ form.name or '' }}" required></label>
  <label>비밀번호 (8자 이상, 영문+숫자)<input name="password" type="password" autocomplete="new-password" required></label>
  <label>비밀번호 확인<input name="password2" type="password" autocomplete="new-password" required></label>
  <div><button class="btn btn-primary">등록하고 시작</button></div>
</form>
{% endblock %}
