{% extends "base.html" %}
{% block content %}
<form class="card form narrow-form" method="post" action="{{ url_for('auth.password') }}">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label>현재 비밀번호<input name="current" type="password" autocomplete="current-password" required></label>
  <label>새 비밀번호 (8자 이상, 영문+숫자)<input name="new" type="password" autocomplete="new-password" required></label>
  <label>새 비밀번호 확인<input name="new2" type="password" autocomplete="new-password" required></label>
  <div><button class="btn btn-primary">변경</button></div>
</form>
{% endblock %}
