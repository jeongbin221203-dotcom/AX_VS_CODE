{% extends "base.html" %}
{% block public %}
{% if sso %}
<section class="card">
  <form method="post" action="{{ url_for('auth.sso_login') }}">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary" type="submit">사내 계정으로 로그인 (SSO)</button>
  </form>
  <p class="muted small">회사 계정·2단계 인증으로 로그인합니다. 권한은 사내 그룹에 따라 자동으로 정해집니다.</p>
</section>
{% endif %}
<form class="card form" method="post" action="{{ url_for('auth.login') }}">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <input type="hidden" name="next" value="{{ next }}">
  <h3>{{ '비상용 관리자 로그인' if sso_only else '로그인' }}</h3>
  <label>아이디<input name="username" value="{{ username }}" autocomplete="username" required autofocus></label>
  <label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label>
  <div><button class="btn btn-primary">로그인</button></div>
  <p class="muted small">계정은 시스템관리자가 발급합니다. 비밀번호를 {{ LOGIN_MAX_FAILS }}번 연속 틀리면 {{ LOGIN_LOCK_MINUTES }}분간 잠깁니다.</p>
</form>
{% endblock %}
