<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>순환 매매 (대형주·중형주)</title>
<meta name="description" content="시총 1~100위 대형주 4자리 순환 매매 — 매수 신호 종목을 사고, 매도·손절 신호가 나면 정리하는 일을 반복 (과거 시뮬레이션)">
<link rel="stylesheet" href="style.css">
<style>
  main.rot { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  .rot section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
  .rot h2 { font-size: 14px; color: var(--text); margin: 0 0 10px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .kpi { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
  .kpi b { display: block; font-size: 20px; }
  .kpi span { color: var(--muted); font-size: 12px; }
  .rot table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .rot th, .rot td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  .rot th:first-child, .rot td:first-child { text-align: left; }
  .rot th { color: var(--muted); font-weight: 600; }
  .scroll { overflow-x: auto; }
  .pos { color: var(--up); } .neg { color: var(--down); }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 10px; background: #243b64; font-size: 12px; }
  .badge-sell { background: #5b2430; color: #ffb3bd; padding: 1px 8px; border-radius: 10px; font-size: 12px; }
  .badge-buy { background: #1f4d34; color: #8be0ad; padding: 1px 8px; border-radius: 10px; font-size: 12px; }
  .bars { display: grid; grid-template-columns: repeat(auto-fit, minmax(70px, 1fr)); gap: 8px; align-items: end; height: 190px; }
  .bar-col { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; font-size: 12px; position: relative; }
  .bar-col .v { margin-bottom: 3px; }
  .bar-col .b { width: 70%; border-radius: 3px 3px 0 0; min-height: 2px; }
  .bar-col .y { margin-top: 4px; color: var(--muted); }
  .note { color: var(--muted); font-size: 12.5px; line-height: 1.6; }
  .warn { border-color: #5c4a14; background: #1d1a10; }
  a.sym { color: var(--accent); text-decoration: none; cursor: pointer; }
  a.sym:hover { text-decoration: underline; }
  svg.eq { width: 100%; height: 220px; display: block; }
  .rules li { margin-bottom: 4px; }
</style>
</head>
<body>
<header class="top">
  <h1>순환 매매</h1>
  <div class="seg" id="tierTabs" role="group" aria-label="시총 구간"><button data-tier="large">대형주</button><button data-tier="mid">중형주</button></div>
  <a class="back" href="index.html" style="color:var(--accent)">← 실시간 차트</a>
  <span id="asof" class="q-time"></span>
</header>
<main class="rot">
  <section class="warn" aria-label="안내"><p class="note" id="warn" style="margin:0"></p></section>

  <section aria-label="요약">
    <h2>한눈에 보기 <small id="statNote"></small></h2>
    <div class="kpis" id="kpis"></div>
  </section>

  <section aria-label="지금 보유">
    <h2>지금 보유 중인 종목 <small id="holdNote"></small></h2>
    <div class="scroll"><table id="hold"><thead><tr><th>종목</th><th>매수 종류</th><th>매수일</th><th>매수가</th><th>현재가</th><th>평가손익</th><th>상태</th></tr></thead><tbody></tbody></table></div>
  </section>

  <section aria-label="오늘 매수 후보">
    <h2>오늘 매수 신호가 난 종목 <small id="candNote"></small></h2>
    <div class="scroll"><table id="cand"><thead><tr><th>순서</th><th>종목</th><th>매수 종류</th><th>60일 고점 대비</th><th>종가</th><th>상태</th></tr></thead><tbody></tbody></table></div>
    <p class="note">자리가 비면 위에서부터 삽니다(T1 → T6 → T3b → T3 → 돌파 순, 같은 종류는 낙폭이 깊은 종목 먼저). 체결은 다음 거래일 시가로 가정합니다.</p>
  </section>

  <section aria-label="해별 수익">
    <h2>해별 수익률 (시뮬레이션)</h2>
    <div class="bars" id="years"></div>
  </section>

  <section aria-label="자산 곡선">
    <h2>자산 곡선 (2017 = 1, 로그 눈금)</h2>
    <svg class="eq" id="eq" viewBox="0 0 1000 220" preserveAspectRatio="none" role="img" aria-label="자산 곡선"></svg>
    <p class="note" id="eqNote"></p>
  </section>

  <section aria-label="최근 청산">
    <h2>최근 정리한 거래</h2>
    <div class="scroll"><table id="recent"><thead><tr><th>종목</th><th>매수 종류</th><th>매수일</th><th>정리일</th><th>수익</th><th>보유일</th><th>정리 이유</th></tr></thead><tbody></tbody></table></div>
  </section>

  <section aria-label="규칙 설명">
    <h2>규칙</h2>
    <ol class="rules note" id="rules"></ol>
  </section>
</main>
<script type="module" src="js/rotation.js"></script>
</body>
</html>
