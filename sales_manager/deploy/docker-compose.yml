# 여러 서버 구성 예시 (한 대에서 전체 흐름을 재현). 운영에서는 DB·저장소를 관리형 서비스로 바꾸면 된다.
#
#   cp .env.example .env        # 비밀값 채우기
#   docker compose up -d --build
#   https://localhost           (사내 인증서를 deploy/certs/server.crt, server.key 로 둔다)
#
#   nginx ─┬─ app1 ─┐
#          └─ app2 ─┼─ postgres (DB)      ← migrate 가 배포 때 한 번 스키마를 올린다
#   worker ─────────┼─ minio (S3 호환 파일 저장소: 증빙·업로드)
#   prometheus ─────┘  /metrics 수집 + 경보 규칙(alerts.yml)
name: sales-crm

x-app: &app
  build: { context: .., dockerfile: Dockerfile }
  image: sales-crm:latest
  env_file: .env
  environment:
    SALES_DATABASE_URL: postgresql://sales:${POSTGRES_PASSWORD}@postgres:5432/sales
    SALES_STORAGE: s3
    SALES_S3_BUCKET: sales-files
    SALES_S3_ENDPOINT: http://minio:9000
    SALES_S3_SSE: ""                       # MinIO 기본 설정은 KMS 없음. AWS S3 에서는 AES256
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    SALES_PROXY_FIX: "1"
    SALES_TRUSTED_PROXIES: 172.30.0.10    # nginx 고정 IP (SSO 헤더 모드일 때만 의미)
    SALES_METRICS_TOKEN: ${SALES_METRICS_TOKEN}
    SALES_PG_DUMP: pg_dump
    SALES_PG_RESTORE: pg_restore
  depends_on:
    migrate: { condition: service_completed_successfully }
    minio-init: { condition: service_completed_successfully }
  restart: unless-stopped
  networks: [backend]

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sales
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d sales"]
      interval: 5s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  minio-init:                               # 버킷 생성 + 버전 관리(실수로 지운 증빙 복구)
    image: minio/mc:latest
    depends_on: { minio: { condition: service_healthy } }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
                  mc mb --ignore-existing local/sales-files &&
                  mc version enable local/sales-files"
    networks: [backend]

  migrate:                                  # 배포마다 한 번: 스키마를 최신으로 (앱은 자동으로 올리지 않는다)
    <<: *app
    command: ["python", "manage.py", "db", "upgrade"]
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  app1:
    <<: *app
  app2:
    <<: *app

  worker:                                   # 배치·알림·ERP 전송. 여러 개로 늘려도 작업은 한 번씩만 처리된다
    <<: *app
    command: ["python", "manage.py", "worker"]
    healthcheck: { disable: true }

  nginx:
    image: nginx:1.27
    depends_on: [app1, app2]
    ports: ["443:443", "80:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
    networks:
      backend: { ipv4_address: 172.30.0.10 }

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./metrics_token:/etc/prometheus/metrics_token:ro    # SALES_METRICS_TOKEN 값만 담은 파일
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped
    networks: [backend]

volumes:
  pgdata:
  miniodata:

networks:
  backend:
    ipam:
      config: [{ subnet: 172.30.0.0/24 }]
