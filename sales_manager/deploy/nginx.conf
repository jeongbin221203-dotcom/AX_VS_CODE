# 앞단 로드밸런서 — TLS 종료, 앱 서버 2대 분산, 요청 ID 전달
upstream sales_app {
    least_conn;
    server app1:8000 max_fails=3 fail_timeout=10s;
    server app2:8000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;              # 앱의 업로드 한도와 같게
    proxy_read_timeout 120s;

    # 요청 ID: 들어온 값이 없으면 nginx 가 만들어 앱 로그와 잇는다
    set $rid $http_x_request_id;
    if ($rid = "") { set $rid $request_id; }

    location = /metrics { return 404; }    # 지표는 내부망에서 앱 서버로 직접 수집

    location / {
        proxy_pass http://sales_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;      # 한 단계만 (앱은 x_for=1 로 읽는다)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $rid;
        # 앱 서버 한 대가 죽거나 재배포 중이면 다른 서버로 (조회만 재시도 — POST 는 중복 방지를 위해 재시도하지 않음)
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    log_format main_rid '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                        '$request_time rid=$rid upstream=$upstream_addr';
    access_log /var/log/nginx/access.log main_rid;
}
