global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files: [/etc/prometheus/alerts.yml]

scrape_configs:
  - job_name: sales
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token     # SALES_METRICS_TOKEN
    static_configs:
      - targets: ["app1:8000", "app2:8000"]
