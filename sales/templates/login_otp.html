{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block public %}
<h1>🔐 2단계 인증</h1>
<p class="muted">인증 앱(Google·Microsoft Authenticator 등)에 표시된 6자리 숫자를 입력하세요. 휴대폰이 없으면 복구 코드(XXXX-XXXX)를 입력합니다.</p>
<form method="post" class="card form" autocomplete="off" data-no-draft>
  {{ csrf() }}
  <label>인증 코드 <input name="code" required autofocus inputmode="numeric" autocomplete="one-time-code" maxlength="9"></label>
  <button class="btn btn-primary">확인</button>
</form>
<p class="small"><a href="{{ url_for('auth.login') }}">처음부터 다시 로그인</a></p>
{% endblock %}
