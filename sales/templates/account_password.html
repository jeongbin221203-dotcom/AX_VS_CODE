{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block content %}
{% if mode != 'password' %}
  <div class="alert alert-info">현재 인증 방식({{ mode }})에서는 이 시스템의 비밀번호를 쓰지 않습니다.
    {% if mode == 'sso' %}비밀번호는 사내 SSO(포털)에서 변경하세요.{% endif %}</div>
{% else %}
  <p class="subtitle">규칙: {{ policy }}</p>
  <form method="post" class="card form narrow-form" autocomplete="off">
    {{ csrf() }}
    <label>현재(임시) 비밀번호 <input type="password" name="current_password" required autocomplete="current-password"></label>
    <label>새 비밀번호 <input type="password" name="new_password" required autocomplete="new-password"></label>
    <label>새 비밀번호 확인 <input type="password" name="confirm_password" required autocomplete="new-password"></label>
    <button class="btn btn-primary">변경</button>
  </form>
{% endif %}
{% endblock %}
